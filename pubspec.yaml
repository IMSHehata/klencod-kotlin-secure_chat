name: secure_chat
description: Private end-to-end encrypted chat for exactly two people.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.4
  cryptography: ^2.7.0
  flutter_secure_storage: ^9.2.2
  file_picker: ^8.1.2
  record: ^5.1.2
  audioplayers: ^6.1.0
  path_provider: ^2.1.4
  open_filex: ^4.5.0
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
